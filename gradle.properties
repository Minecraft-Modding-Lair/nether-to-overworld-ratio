# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map (see buildSrc/src/main/groovy/multiloader-common.gradle).

# Project
version=1.0.0
group=dev.naturegecko.netheroverworldratio
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Nether to Overworld Ratio
mod_author=Rin Intharat
mod_id=nether_overworld_ratio
license=MIT
credits=
description=Configure how far travelling in the Nether takes you in the Overworld. \nVanilla is a fixed 1:8 ratio & this mod lets you change... e.g. to 1:1 or 1:0.125 for reversed!.
minecraft_version_range=[1.21.1, 1.22)

## This is the version of Minecraft that the 'common' project targets for NeoForm, see:
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430

# The version of ParchmentMC used for friendlier parameter names, see https://parchmentmc.org/docs/getting-started#choose-a-version
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
fabric_loader_version=0.16.9

# NeoForge
neoforge_version=21.1.80
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home

